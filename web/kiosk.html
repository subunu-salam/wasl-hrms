<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="robots" content="noindex">
<title>Wasl · Face ID clock-in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="kiosk.css">
</head>
<body>
<header class="kbar">
  <div class="kbrand"><span class="klogo">W</span><div><b id="kCompany">Wasl</b><small id="kSite">Face ID clock-in</small></div></div>
  <div class="kclock"><b id="kTime">--:--</b><small id="kDate"></small></div>
</header>

<main class="kstage" id="kStage" data-state="boot">
  <div class="kcam">
    <video id="kVideo" playsinline muted autoplay></video>
    <svg class="kring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle class="arc" id="kArc" cx="50" cy="50" r="47" pathLength="100"/></svg>
    <div class="kok" aria-hidden="true"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-17"/></svg></div>
    <div class="kno" aria-hidden="true"><svg viewBox="0 0 52 52"><path d="M17 17l18 18M35 17L17 35"/></svg></div>
  </div>
  <div class="ktext" aria-live="polite">
    <h1 id="kTitle">Starting camera…</h1>
    <p id="kSub">One moment</p>
    <div class="ktimer" id="kTimer" hidden></div>
  </div>
</main>

<section class="ksetup" id="kSetup" hidden>
  <div class="kcard">
    <span class="klogo big">W</span>
    <h1>Link this tablet</h1>
    <p>HR: in Wasl, open <b>Time → Time &amp; roster → Face ID</b>, choose <b>Create tablet link</b>, and open that link on this tablet (or scan its QR code). The tablet remembers it.</p>
    <p class="kerr" id="kSetupErr"></p>
  </div>
</section>

<footer class="kfoot"><span id="kFootMsg">Look at the camera to clock in or out</span><button id="kFull" class="kbtn" type="button">Full screen</button></footer>
<script type="module" src="kiosk.js"></script>
</body>
</html>
